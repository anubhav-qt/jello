[package]
name = "jello"
version = "0.1.0"
description = "Jello, a synthesizer and music studio"
authors = ["anubhav-qt"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name different from the app binary's
# name, which avoids a Cargo bug on Windows (rust-lang/cargo#8519).
name = "jello_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
toml = "1"
tiny_http = "0.12"
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.23.1"
pdfium-render = "0.9.4"
tauri-plugin-dialog = "2"
whisper-rs = "0.16.0"
sha2 = "0.10.9"

# whisper.cpp is far too slow to use unoptimized, even while developing.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
debug = false

# Smaller, faster release builds: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
